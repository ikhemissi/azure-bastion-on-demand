[project]
name = "azure-private-access"
version = "0.1.0"
description = "Can Azure Bastion Standard, created on demand and deleted automatically when its time is up, give a developer secure access from their laptop to private resources in a virtual network (private DNS, kubectl, azd deploy, private web apps and data services) at a low cost?"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "openai>=3.42.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
