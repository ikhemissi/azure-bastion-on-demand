[project]
name = "azure-private-access"
version = "0.1.0"
description = "Which way into a virtual network, Azure Bastion Developer with a jumpbox or Azure Bastion Standard on demand with native-client tunnels, lets a developer use private resources (private DNS, kubectl, azd deploy, private web apps and data services) securely, at the lowest cost and effort?"
requires-python = ">=3.13"
dependencies = [
    "azure-identity>=1.27.0",
    "openai>=3.42.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"
