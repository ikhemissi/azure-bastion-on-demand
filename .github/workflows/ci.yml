# Offline checks on every push and pull request: the reaper's unit tests, Terraform (format, validation of the root,
# the modules' tests with mock providers) and shellcheck. No Azure access and no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reaper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test BastionReaper.slnx

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"
          terraform_wrapper: false
      - name: Format
        run: terraform -chdir=infra fmt -check -recursive
      - name: Validate the root
        run: |
          terraform -chdir=infra init -backend=false -input=false
          terraform -chdir=infra validate
      - name: Module tests
        run: |
          for module in infra/modules/*/; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test
          done

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck -x scripts/*.sh jumpbox/*.sh infra/hooks/*/*.sh
